<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Organizador de Documentos para Habilitação</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-storage-compat.js"></script>
  <script src="firebase-config.js"></script>
</head>
<body>

  <!-- TELA DE LOGIN -->
  <div class="login-overlay" id="loginOverlay">
    <div class="login-box">
      <h1>📁 Organizador de Documentos</h1>
      <p class="login-sub">Entre para acessar seus dados de qualquer dispositivo</p>

      <div class="login-field">
        <label>E-mail</label>
        <input type="email" id="loginEmail" placeholder="seuemail@exemplo.com">
      </div>
      <div class="login-field">
        <label>Senha</label>
        <input type="password" id="loginSenha" placeholder="Mínimo 6 caracteres">
      </div>

      <div class="login-msg" id="loginMsg"></div>

      <button class="btn btn-primary login-btn" onclick="fazerLogin()">Entrar</button>
      <button class="btn btn-outline login-btn" onclick="criarConta()">Criar conta nova</button>
    </div>
  </div>

  <!-- CONTEÚDO DO APP (só aparece após login) -->
  <div id="appContent" hidden>

  <!-- HEADER -->
  <div class="header">
    <h1>📁 Organizador de Documentos para Habilitação</h1>
    <div class="header-user">
      <span id="userEmailLabel"></span>
      <button class="btn-logout" onclick="fazerLogout()">Sair</button>
    </div>
    <div class="progress-bar-wrap">
      <div class="progress-bar" id="globalBar" style="width:0%"></div>
    </div>
    <div class="progress-label" id="globalLabel">0 de 9 documentos anexados</div>
  </div>

  <!-- IDENTIFICAÇÃO DA EMPRESA -->
  <div class="id-section">
    <h2>📋 Identificação da Empresa</h2>
    <div class="id-field"><label>Razão Social</label><input type="text" id="razao" placeholder="Nome completo da empresa"></div>
    <div class="id-field"><label>CNPJ</label><input type="text" id="cnpj" placeholder="00.000.000/0000-00"></div>
    <div class="id-field"><label>Representante Legal</label><input type="text" id="rep" placeholder="Nome do responsável"></div>
    <div class="id-field"><label>E-mail para notificações</label><input type="text" id="email" placeholder="email@empresa.com.br"></div>
    <div class="id-field"><label>Telefone</label><input type="text" id="tel" placeholder="(00) 00000-0000"></div>
    <div class="id-field"><label>Data de preenchimento</label><input type="date" id="datapreench"></div>
  </div>

  <!-- SEÇÕES DE DOCUMENTOS -->
  <div class="sections" id="sectionsContainer"></div>

  <!-- BOTÕES -->
  <div class="actions">
    <button class="btn btn-primary" onclick="abrirRelatorio()">📊 Gerar Relatório de Pendências</button>
    <button class="btn btn-success" onclick="salvarProgressoManual()">💾 Salvar Progresso</button>
    <button class="btn btn-outline" onclick="window.print()">🖨️ Imprimir</button>
    <button class="btn btn-package" onclick="exportarPacote()">📦 Baixar Pacote Completo (ZIP)</button>
  </div>

  <!-- CONFIRMAÇÃO DE SALVAMENTO -->
  <div class="toast" id="toastSalvo">✅ Progresso salvo neste navegador</div>

  <!-- MODAL RELATÓRIO -->
  <div class="modal-overlay" id="modalOverlay" onclick="fecharModal(event)">
    <div class="modal" id="modalContent">
      <h2>📊 Relatório de Pendências</h2>
      <p class="meta" id="relMeta"></p>
      <div class="summary-cards" id="relSummary"></div>
      <div id="relBody"></div>
      <button class="btn btn-primary modal-close" onclick="document.getElementById('modalOverlay').classList.remove('open')">Fechar</button>
    </div>
  </div>

  </div> <!-- fim #appContent -->

  <script src="app.js"></script>
</body>
</html>
